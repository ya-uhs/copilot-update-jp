<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Copilot Update Japanese RSS</title>
  <meta name="description" content="Microsoft 365 Copilot と GitHub Copilot の公式更新情報を日本語で整理">
  <link rel="alternate" type="application/rss+xml" title="Copilot Update Japanese RSS" href="feed.xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <p class="eyebrow">OFFICIAL UPDATES, IN JAPANESE</p>
      <h1>Copilot Update</h1>
      <p class="lead">Microsoft 365 Copilot と GitHub Copilot の公式更新を、静かに追いかけるためのフィード。</p>
      <a class="rss" href="feed.xml">RSSを購読</a>
    </div>
  </header>
  <main>
    <section class="filters" aria-label="記事フィルター">
      <label>Product<select id="product"><option value="">すべて</option></select></label>
      <label>Importance<select id="importance"><option value="">すべて</option><option>high</option><option>medium</option><option>low</option></select></label>
      <label>Status<select id="status"><option value="">すべて</option></select></label>
      <span id="count" aria-live="polite"></span>
    </section>
    <section id="articles" class="articles" aria-live="polite"><p>読み込み中…</p></section>
  </main>
  <footer>情報源は Microsoft と GitHub の公式公開情報のみです。</footer>
  <script src="assets/app.js" defer></script>
</body>
</html>
