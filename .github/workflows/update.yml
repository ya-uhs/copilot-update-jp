name: Update Copilot feed

on:
  workflow_dispatch:
  schedule:
    # 07:00, 13:00, 19:00 JST (UTC has no daylight saving time in Japan)
    - cron: "0 22,4,10 * * *"

permissions:
  contents: write

concurrency:
  group: copilot-feed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, summarize, and build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m scripts.update
      - name: Commit generated changes
        run: |
          if git diff --quiet -- data docs; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json docs/data.json docs/feed.xml
          git commit -m "chore: update Copilot feed [skip ci]"
          git push

